[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kairoseki"
dynamic = ["version"]
description = "Seastone for your AI agents: an MCP firewall that breaks the lethal trifecta with taint tracking."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anthony Rivera", email = "anthony.g.rivera.i@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "security", "prompt-injection", "llm", "firewall", "claude", "cursor"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["pyyaml>=6.0", "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/AnthonyRiveraI/kairoseki"
Issues = "https://github.com/AnthonyRiveraI/kairoseki/issues"

[project.scripts]
kairoseki = "kairoseki.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "mcp>=1.10"]

[tool.hatch.version]
path = "src/kairoseki/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kairoseki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kairoseki"]
mypy_path = "src"
