name: MCP Risk Index

on:
  schedule:
    - cron: "17 5 * * 1"  # weekly, Monday 05:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: How many registry servers to scan
        default: "1000"

concurrency:
  group: risk-index
  cancel-in-progress: false

jobs:
  scan:
    # starts third-party MCP servers: no secrets, read-only token, nothing persisted but the site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - name: Scan the MCP registry
        run: >
          uv run python scripts/index/build.py --out site --workers 12 --timeout 60
          --limit "${{ inputs.limit || '1000' }}"
          --previous "https://anthonyriverai.github.io/kairoseki/index.json"
      - name: Add the launch video (attached to the release, served from Pages so it plays in the browser)
        run: |
          for l in en es; do
            curl -fsSL -o "site/kairoseki-$l.mp4" "https://github.com/AnthonyRiveraI/kairoseki/releases/download/v0.2.3/kairoseki-$l.mp4"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
