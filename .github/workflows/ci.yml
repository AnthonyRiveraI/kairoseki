name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - run: uv run ruff check src tests scripts evals
      - run: uv run ruff format --check src tests scripts evals
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.mcp }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        mcp: ["mcp<2", "mcp>=2"]
        exclude:
          - python: "3.10"
            mcp: "mcp>=2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install -e . "${{ matrix.mcp }}" pytest pytest-asyncio
      - run: uv run --no-sync pytest -q

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Detector, labels and hooks meet their thresholds
        run: uv run python evals/run.py --verbose

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The GitHub Action scans an MCP server
        id: scan
        uses: ./
        with:
          command: uvx --from . python -m kairoseki.lab.server --role web
          fail-on: F
      - run: test -s kairoseki-card.svg && echo "grade ${{ steps.scan.outputs.grade }}"

  attack-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Every real-world attack must be blocked
        run: uv run kairoseki attack --badge score.svg
      - uses: actions/upload-artifact@v4
        with:
          name: kairoseki-score
          path: score.svg
